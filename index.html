function markEarlier(cat,n,finishedEarlier){const arr=trackItems(cat);for(let i=0;i<arr.length;i++){const id=arr[i].id;if(i<n-1){if(finishedEarlier){if(!S.completed[id]||S.skipped[id]){S.completed[id]||={date:'before-tracker'};delete S.skipped[id];markSync(id,'done')}}else if(!S.completed[id]&&!S.skipped[id]){S.skipped[id]=true;markSync(id,'skip')}}else if(S.skipped[id]){delete S.skipped[id];markSync(id,'todo')}}}

function todays(){
 const ids=S.plan.ids||[],left=ids.filter(id=>!S.completed[id]),done=ids.filter(id=>S.completed[id]);
 const hours=totalMinutes(dt()),week=weekMinutes();
 return '<div class="hero"><div><div class="eyebrow">Your engineering focus</div><h1>Today</h1>'+

 '<div class="logRow"><span>✓ '+esc(displayName(id))+'</span>'+button('Undo','undo:'+id,'btn ghost sm')+'</div>').join('')+'</section>':'')+
 '<section class="panel"><div class="row between"><span class="small dim">Study time this week</span>'+

function timerView(){if(!activeTimer)return `<div class="sectionNote" style="margin-top:8px">Start a timer from any task. It keeps running when you open a lesson in another tab, and saves when you close the page.</div>`;return `<div class="session"><div class="tiny" style="color:#bdebe1">${esc(displayName(activeTimer.id))}</div><div id="clock">${formatClock(activeTimer.seconds+(activeTimer.running?Math.max(0,Math.floor((Date.now()-activeTimer.anchor)/1000)):0))}</div><div class="actions">${button(activeTimer.running?'Pause':'Resume','pause','btn primary')}${button('Save session','saveTimer')}${button('Discard','discardTimer','btn ghost')}</div></div>`}

function trackSummary(cat){const tasks=trackItems(cat),total=tasks.length||1,completed=tasks.filter(t=>S.completed[t.id]).length;const nextt=next(cat);const mins=S.logs.filter(l=>l.cat===cat).reduce((a,l)=>a+Number(l.min||0),0);

function courses(){let intro=`<div class="hero"><div><div class="eyebrow">Daily practice + core learning</div><h1>Learning tracks & projects</h1><div class="datecaps">Electronics is your main priority. KiCad and SolidWorks stay practical and video-guided. Set your starting point where needed.</div></div></div>`;
return intro+(filter==='all'?`<div class="coursegrid">${Object.keys(C).map(trackSummary).join('')}</div><div class="panel mt"><h2 class="mainTitle">Course catalog notes</h2><p class="sectionNote">Andre LaMothe’s public curriculum confirms 161 lectures. The first 26 titles are verified; later entries are editable placeholders, not guessed titles. Brian Douglas’s 25 core titles are entered in order. M-HIVE lists 51 total sessions, while this starter plan selects safe introductory hardware/software lessons. Phil’s Lab is a curated selection, not a numbered official course. SolidWorks now uses direct modeling and assembly videos; KiCad starts with an exact DigiKey water-alarm tutorial and continues with clearly labeled video-assisted independent designs. Start the quadcopter CAD concept during your growing assembly experience; no prerequisite to finish an entire flight controller.</p></div>`:
`<div class="panel"><div class="row between" style="flex-wrap:wrap"><div><h2 class="mainTitle">${esc(C[filter].label)}</h2><p class="subhead">${esc(C[filter].count)}</p></div><div class="actions">${button('All tracks','all','btn ghost')}${button('Change starting point',`start:${filter}`)}${button('Add a task',`custom:${filter}`)}</div></div><div class="divider"></div>${trackItems(filter).filter(t=>!S.skipped[t.id]).slice(0,filter==='electronics'?161:60).map(t=>{const tt=get(t.id);return `<div class="courseitem"><div class="row between"><span class="number">${esc(tt.serial?`${(tt.category==='cad'||tt.category==='pcbprojects')?'Task':'Lesson'} ${tt.serial}`:tt.kind)} ${S.completed[tt.id]?'· Completed ✓':''}</span>${button('Edit',`edit:${tt.id}`,'btn ghost sm')}</div><h3 style="${S.completed[tt.id]?'color:#83a79f':''}">${esc(tt.title)}</h3><p>${esc(tt.minutes)} min estimate${tt.verified===false?' · Exact title not yet confirmed':''}</p><div class="actions"><a class="btn sm" href="${esc(tt.url)}" target="_blank" rel="noopener">Open ↗</a>${S.completed[tt.id]?button('Undo',`undo:${tt.id}`,'btn sm'):button('Mark done',`done:${tt.id}`,'btn primary sm')}${button('Log time',`log:${tt.id}`,'btn ghost sm')}</div></div>`}).join('')}</div>`)}
function progress(){const cats=Object.keys(C),start=weekStart();let logs=S.logs.filter(l=>l.date>=start);const daily={};for(let l of logs)daily[l.date]=(daily[l.date]||0)+Number(l.min||0);
const weekDays=Array.from({length:7},(_,i)=>{let d=new Date(start+'T12:00:00');d.setDate(d.getDate()+i);return dt(d)});
let completed=Object.keys(S.completed).filter(k=>S.completed[k]).length;
return `<div class="hero"><div><div class="eyebrow">Your learning activity</div><h1>Progress</h1><div class="datecaps">Hours are based only on sessions you recorded.</div></div></div><div class="panels"><div class="stack"><div class="panel"><h2 class="mainTitle">This week</h2><div class="metricrow mt"><div class="metric"><b>${minutesFmt(weekMinutes())}</b><span>Study time</span></div><div class="metric"><b>${minutesFmt(totalMinutes())}</b><span>All time</span></div><div class="metric"><b>${completed}</b><span>Tasks done</span></div></div>${weekDays.map(d=>`<div class="barrow"><div class="top"><span>${new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short'})}</span><span>${minutesFmt(daily[d]||0)}</span></div><div class="progress"><i style="width:${Math.min(100,100*(daily[d]||0)/S.settings.dailyMinutes)}%"></i></div></div>`).join('')}</div><div class="panel"><h2 class="mainTitle">Where your time went</h2>${cats.map(cat=>{let m=S.logs.filter(l=>l.cat===cat).reduce((a,l)=>a+Number(l.min),0);return `<div class="barrow"><div class="top"><span>${esc(titleOf(cat))}</span><b>${minutesFmt(m)}</b></div><div class="progress"><i style="width:${Math.min(100,100*m/Math.max(1,totalMinutes()))}%;background:${C[cat].color}"></i></div></div>`}).join('')}</div></div><div class="panel"><h2 class="mainTitle">Recent sessions</h2>${S.logs.length?[...S.logs].reverse().slice(0,25).map(l=>`<div class="logRow"><div>${esc(l.date)} · <b>${esc(titleOf(l.cat))}</b><div class="dim tiny">${esc(l.note||displayName(l.taskId)||'Study')}</div></div><div><b>${minutesFmt(l.min)}</b> ${button('×',`delLog:${l.id}`,'btn ghost sm')}</div></div>`).join(''):'<p class="sectionNote">No study sessions recorded yet.</p>'}</div></div>`}
function settings(){return `<div class="hero"><div><div class="eyebrow">Keep it manageable</div><h1>Settings</h1><div class="datecaps">Daily plans automatically adjust based on your unfinished work.</div></div></div><div class="panels"><div class="stack"><div class="panel"><h2 class="mainTitle">Daily work plan</h2><form id="settingsForm" class="stack mt"><div class="formgrid"><div><label for="slots">Tasks per day</label><select class="field" name="slots" id="slots"><option value="1" ${S.settings.slots===1?'selected':''}>1 task</option><option value="2" ${S.settings.slots===2?'selected':''}>2 tasks</option><option value="3" ${S.settings.slots===3?'selected':''}>3 tasks (recommended)</option></select></div><div><label for="goal">Daily study minutes</label><input class="field" type="number" name="dailyMinutes" id="goal" min="10" max="360" value="${S.settings.dailyMinutes}"></div></div><div><label>Included tracks</label>${Object.keys(C).map(cat=>`<label style="display:flex;gap:8px;align-items:center;margin:9px 0;color:var(--text);font-weight:500"><input type="checkbox" name="on-${cat}" ${S.settings.enabled[cat]?'checked':''}> ${esc(C[cat].label)}</label>`).join('')}</div><button class="btn primary" type="submit">Save preferences</button></form></div><div class="panel"><h2 class="mainTitle">Starting points</h2><p class="sectionNote">For video courses, set your current lesson. CAD and PCB practicals start from Task 1 and advance when each step is completed.</p>${Object.keys(C).map(cat=>`<div class="logRow"><span>${esc(titleOf(cat))} <span class="dim tiny">(start ${S.settings.starts[cat]})</span></span>${button('Change',`start:${cat}`,'btn sm')}</div>`).join('')}</div></div><aside class="stack"><div class="panel"><h2 class="mainTitle">Install on your phone</h2><p class="sectionNote" id="installHelp">Once this app is hosted at an HTTPS address, open it in Chrome and tap the browser menu → Install app / Add to Home screen. Then launch NextStep from your app screen.</p><div class="actions"><button class="btn primary hidden" id="installButton" type="button">Install NextStep</button></div></div><div class="panel" id="nextstepCloudPanel"><h2 class="mainTitle">Cloud sync</h2><p class="sectionNote">Loading sync controls… Your local progress stays safe.</p></div><div class="panel"><h2 class="mainTitle">Backups</h2><p class="sectionNote">Your tasks and study time save automatically on this device. Export a backup to protect your history or move it to another device. Clearing site data or uninstalling can erase local progress.</p><div class="actions">${button('Export backup','export','btn primary')}${button('Import backup','import')}</div><input id="importfile" type="file" accept=".json,application/json" hidden></div><div class="panel"><h2 class="mainTitle">Online use</h2><p class="sectionNote">After hosting this app on HTTPS, open it in Chrome and choose Install app or Add to Home screen. It opens from your home screen and works offline after the first load. Sign in to Cloud Sync on both devices to share study progress automatically. Offline changes are saved locally. NextStep never updates ChatGPT Memory.</p></div><div class="panel"><h2 class="mainTitle">Data control</h2><p class="sectionNote">You control your study data. It remains local until you sign in to cloud sync. An authenticated account can store your progress in its private database.</p>${button('Reset everything','reset','btn warn')}</div></aside></div>`}
function render(){normalizedPlan();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('app').innerHTML=view==='today'?todays():view==='courses'?courses():view==='progress'?progress():settings();window.dispatchEvent(new Event('nextstep:render'))}
function dialog(html){let d=document.getElementById('dialog');document.getElementById('dialogbody').innerHTML=html;d.showModal()}

function action(a){if(a==='more'){const selected=new Set(S.plan.ids);let lastcats=S.plan.ids.map(id=>get(id)?.category);let pool=Object.keys(C).filter(cat=>S.settings.enabled[cat]);pool.sort((a,b)=>lastcats.includes(a)-lastcats.includes(b));let t=pool.map(c=>next(c,selected)).find(Boolean);if(t){S.plan.ids.push(t.id);save();render();notice('One more task added to today')}else notice('No more tasks in your selected tracks');return}
 if(a==='replan'){S.plan.date='';normalizedPlan();render();notice('Plan refreshed, unfinished tasks retained');return}
 if(a==='all'){filter='all';render();return}
 if(a==='pause'){if(activeTimer){if(activeTimer.running){activeTimer.seconds+=Math.max(0,Math.floor((Date.now()-activeTimer.anchor)/1000));activeTimer.running=false}else{activeTimer.anchor=Date.now();activeTimer.running=true}render()}return}
 if(a==='saveTimer'){saveTimer();return}
 if(a==='discardTimer'){activeTimer=null;render();return}
 if(a==='export'){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`NextStep-backup-${dt()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);return}
 if(a==='import'){document.getElementById('importfile').click();return}
 if(a==='reset'){if(window.NextStepCloud?.isSignedIn()){alert('Sign out from Cloud sync before resetting. Your cloud history will not be deleted by a local reset.');return}if(confirm('Permanently reset all saved study progress in this browser? Export a backup first.')){S=defaults();save();filter='all';view='today';render()}return}
 let [type,id]=a.split(':');const t=get(id);
 if(type==='show'){filter=id;view='courses';render();return}
 if(type==='done'){S.completed[id]={date:dt()};delete S.skipped[id];markSync(id,'done');save();render();notice('Completed — well done');return}
 if(type==='undo'){delete S.completed[id];markSync(id,'todo');save();render();return}
 if(type==='timer'){if(activeTimer&&activeTimer.seconds>0&&activeTimer.id!==id){alert('Save or discard your current timer before starting another.');return}activeTimer={id,seconds:0,running:true,anchor:Date.now()};render();return}
 if(type==='log'){dialog(`<h2 class="dialogtitle">Log study time</h2><p class="sectionNote">${esc(t.title)}</p><form id="logForm"><input type="hidden" name="id" value="${esc(id)}"><label>Minutes studied</label><input name="min" class="field" type="number" min="1" max="500" required value="25"><label class="mt">Optional note</label><input name="note" class="field" placeholder="What did you learn?"><div class="actions mt"><button class="btn primary" type="submit">Save time</button><button class="btn ghost" type="button" data-action="close">Cancel</button></div></form>`);return}
 if(type==='edit'){dialog(`<h2 class="dialogtitle">Edit task</h2><form id="editForm"><input type="hidden" name="id" value="${esc(id)}"><label>Task or lesson title</label><input required name="title" class="field" value="${esc(t.title)}"><label class="mt">Lesson URL</label><input name="url" type="url" class="field" value="${esc(t.url)}"><label class="mt">Estimated minutes</label><input name="minutes" min="5" max="480" type="number" class="field" value="${esc(t.minutes)}"><label class="mt">Practical step / note</label><textarea name="note" class="field" rows="3">${esc(t.note)}</textarea><div class="actions mt"><button class="btn primary" type="submit">Save task</button><button class="btn ghost" type="button" data-action="close">Cancel</button></div></form>`);return}
 if(type==='start'){let cat=id,opts=trackItems(cat);dialog(`<h2 class="dialogtitle">Set starting point</h2><p class="sectionNote">${esc(titleOf(cat))}: You can start where you actually are. This does not mark earlier videos complete.</p><form id="startForm"><input type="hidden" name="cat" value="${cat}"><label>Start from task/lesson number (1–${opts.length})</label><input name="num" class="field" type="number" min="1" max="${opts.length}" value="${S.settings.starts[cat]||1}" required><label style="display:flex;gap:8px;align-items:center;color:var(--text);margin:12px 0"><input type="checkbox" name="finishedEarlier" checked> I have completed earlier lessons</label><div class="actions mt"><button type="submit" class="btn primary">Save starting point</button><button type="button" class="btn ghost" data-action="close">Cancel</button></div></form>`);return}
 if(type==='custom'){let cat=id;dialog(`<h2 class="dialogtitle">Add your own task</h2><form id="customForm"><input type="hidden" name="cat" value="${cat}"><label>Task name</label><input name="title" class="field" required placeholder="Example: Review PCB decoupling"><label class="mt">Resource URL (optional)</label><input name="url" class="field" type="url" placeholder="https://"><label class="mt">Estimated minutes</label><input name="minutes" class="field" type="number" value="30" min="5" max="480"><label class="mt">What to do</label><textarea name="note" class="field" rows="2"></textarea><div class="actions mt"><button class="btn primary" type="submit">Add task</button><button class="btn ghost" type="button" data-action="close">Cancel</button></div></form>`);return}

}
function addLog(id,minutes,note=''){const t=get(id);if(!t)return;S.logs.push({id:`${Date.now()}-${Math.random().toString(36).slice(2)}`,date:dt(),taskId:id,cat:t.category,min:Math.round(minutes*10)/10,note});save();}

document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b){view=b.dataset.view;filter='all';render()}});

 if(formId==='startForm'){const cat=d.cat,n=Math.max(1,Math.min(Number(d.num),trackItems(cat).length));S.settings.starts[cat]=n;markEarlier(cat,n,!!d.finishedEarlier);S.syncMeta.settingsAt=Date.now();S.plan.date='';save();close()}
 if(formId==='customForm'){let cat=d.cat;S.custom.push({id:`custom-${Date.now()}-${Math.random().toString(36).slice(2)}`,category:cat,title:d.title.trim(),url:d.url.trim()||C[cat].source,minutes:Number(d.minutes)||30,note:d.note||'',kind:'practice',verified:true});save();close()}
 if(formId==='settingsForm'){S.settings.slots=Math.min(3,Math.max(1,Number(d.slots)||2));S.settings.dailyMinutes=Math.max(10,Math.min(360,Number(d.dailyMinutes)||90));for(const cat of Object.keys(C))S.settings.enabled[cat]=!!d[`on-${cat}`];S.syncMeta.settingsAt=Date.now();S.plan.date='';save();notice('Preferences saved')}
render();

});
document.addEventListener('change',e=>{if(e.target.id==='importfile'){let file=e.target.files?.[0];if(!file)return;file.text().then(txt=>{try{let incoming=JSON.parse(txt);if(incoming.version!==1||!Array.isArray(incoming.logs)||!incoming.settings)throw Error('Not a NextStep backup');if(confirm('Replace this browser’s progress with imported data?')){S={...defaults(),...incoming};save();filter='all';view='today';render();notice('Backup restored')}}catch(e){alert('Import failed: '+e.message)}})}});

  snapshot:()=>JSON.parse(JSON.stringify(S)),
  apply:incoming=>{
    suppressCloudNotify=true;
    try{
      const keepPlan=S.plan||{date:'',ids:[]};
      const def=defaults();
      S={...def,...S,...incoming,settings:{...def.settings,...(incoming.settings||{}),
         starts:{...def.settings.starts,...(incoming.settings?.starts||{})},
         enabled:{...def.settings.enabled,...(incoming.settings?.enabled||{})}},
         syncMeta:{...def.syncMeta,...(incoming.syncMeta||{})},
         plan:{date:'',ids:keepPlan.ids||[]}};
      localStorage.setItem(KEY,JSON.stringify(S));
      render();
    }finally{suppressCloudNotify=false}
  }
};
render();
